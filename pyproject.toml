[project]
name = "agent-ops-hub"
version = "0.1.0"
description = "Governed, observable, budget-capped agents on LangGraph + OpenRouter + Langfuse"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "langfuse>=3.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "pillow>=13.0.0",
    "markdown-it-py>=4.2.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
