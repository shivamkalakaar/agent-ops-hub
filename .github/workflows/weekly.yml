name: linkedin draft (weekdays)   # file name kept: the dashboard dispatches weekly.yml
on:
  schedule:
    - cron: "0 15 * * 1-5"   # Mon-Fri 08:00 PT (PDT)
  workflow_dispatch:
    inputs:
      revise_draft_id: { description: "Rewrite this saved draft around the owner's take (from the queue)", required: false, default: "" }
concurrency: { group: market-intel, cancel-in-progress: false }
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run python -m agents.market_intel collect   # scores stories pushed from that morning's brief
      # a scheduled run skips when 2 drafts are already waiting; "Generate a new draft" in the queue always drafts
      - if: inputs.revise_draft_id == ''
        run: uv run python -m agents.market_intel draft ${{ github.event_name == 'schedule' && '--skip-if-pending 2' || '' }}
      - if: inputs.revise_draft_id != ''
        run: uv run python -m agents.market_intel draft --redraft "$DRAFT_ID"
        env: { DRAFT_ID: "${{ inputs.revise_draft_id }}" }
