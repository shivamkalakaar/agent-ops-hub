name: ci
on:
  push:
  pull_request:
jobs:
  tests:   # offline: fake LLM + SQLite, no secrets needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
  # Real models, only for the agent whose prompts or code changed. Two tiers:
  # - reviewer evals (~1 min, ~$0.04): only the checkers, on frozen labelled posts. On PRs and on main. Reported, not
  #   gated yet: the editor and logic check still flag some of Shivam's own posts.
  # - end-to-end (PRs only, ~5 min): LinkedIn writes on the stories behind 3 of Shivam's posts + 1 rejected draft, and a
  #   fixed judge compares it with his (evals/reference.py); Substack runs 2 golden windows. This tier gates.
  # Results: the PR comment, the job summary, an artifact, and the eval runs on the dashboard.
  evals:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25   # cases run 4 at a time; a Substack case takes ~5-8 min
    permissions: { contents: read, pull-requests: write }
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      EVAL_TRIGGER: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Skip unless prompts, config or agent code changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          fi
          if echo "$files" | grep -qE '^(agents/market_intel/|config/style/guide|config/models.yaml|core/|evals/)'; then
            echo "market_intel=true" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -qE '^(agents/substack/|config/style/substack_guide|config/models.yaml|core/|evals/)'; then
            echo "substack=true" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@v6
        if: steps.changed.outputs.market_intel == 'true' || steps.changed.outputs.substack == 'true'
      - if: steps.changed.outputs.market_intel == 'true' || steps.changed.outputs.substack == 'true'
        run: uv sync --frozen --no-dev
      - id: reviewers
        if: steps.changed.outputs.market_intel == 'true'
        continue-on-error: true
        run: uv run python -m evals.run_reviewer_evals --agent market_intel
      - id: reviewers_substack
        if: steps.changed.outputs.substack == 'true'
        continue-on-error: true
        run: uv run python -m evals.run_reviewer_evals --agent substack
      - id: linkedin
        if: github.event_name == 'pull_request' && steps.changed.outputs.market_intel == 'true'
        continue-on-error: true
        run: uv run python -m evals.run_evals   # --full adds the golden days and every reference case
      - id: substack
        if: github.event_name == 'pull_request' && steps.changed.outputs.substack == 'true'   # 2 cases, images off
        continue-on-error: true
        run: uv run python -m evals.run_evals --agent substack
      - name: Report
        if: always() && (steps.changed.outputs.market_intel == 'true' || steps.changed.outputs.substack == 'true')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cat evals/results/*.md > report.md 2>/dev/null || echo "Evals didn't produce results; see the job log." > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --edit-last --body-file report.md 2>/dev/null || gh pr comment "$PR_NUMBER" --body-file report.md
          fi
      - uses: actions/upload-artifact@v4
        if: always() && (steps.changed.outputs.market_intel == 'true' || steps.changed.outputs.substack == 'true')
        with: { name: eval-results, path: evals/results/, if-no-files-found: ignore }
      - name: Fail if an eval failed
        if: steps.linkedin.outcome == 'failure' || steps.substack.outcome == 'failure'
        run: exit 1
