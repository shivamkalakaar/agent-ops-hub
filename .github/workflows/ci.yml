name: ci
on:
  push:
  pull_request:
jobs:
  tests:   # offline: fake LLM + SQLite, no secrets needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
  evals:   # real models on golden weeks; only when prompts or agent logic change
    if: github.event_name == 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Skip unless prompts, config or agent code changed
        id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(agents/|config/|core/llm.py|evals/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@v6
        if: steps.changed.outputs.run == 'true'
      - if: steps.changed.outputs.run == 'true'
        run: uv sync --frozen --no-dev && uv run python -m evals.run_evals --cases 5
