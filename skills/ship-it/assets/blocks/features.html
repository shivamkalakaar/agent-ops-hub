<section class="block block-features tone-{{tone}}" id="{{id}}" aria-labelledby="{{id}}-title">
  <div class="container">
    <header class="block-head">
      {{#if eyebrow}}<p class="eyebrow">{{eyebrow}}</p>{{/if}}
      <h2 id="{{id}}-title">{{{title}}}</h2>
      {{#if intro}}<p class="lead">{{{intro}}}</p>{{/if}}
    </header>
    <ul class="feature-list variant-{{variant}} cols-{{cols}}">
      {{#each items}}
      <li class="feature">
        {{#if icon}}<span class="icon-chip"><svg class="icon" aria-hidden="true"><use href="#i-{{icon}}"/></svg></span>{{else}}{{#if rows}}<span class="feature-num" aria-hidden="true">{{@number2}}</span>{{/if}}{{/if}}
        <h3>{{title}}</h3>
        <p>{{{text}}}</p>
      </li>
      {{/each}}
    </ul>
  </div>
</section>
